name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "blogwriter-${GITHUB_REF_NAME}.apk"
      - name: Release notes (download link on top, then commits since the previous tag)
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## 📥 다운로드: [blogwriter-${GITHUB_REF_NAME}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/blogwriter-${GITHUB_REF_NAME}.apk)"
            echo "탭에서 이 링크를 눌러 내려받고, '알 수 없는 앱 설치'를 허용한 뒤 여세요."
            echo
            if [ -n "$prev" ]; then echo "## 변경 사항 (${prev} → ${GITHUB_REF_NAME})"; else echo "## 변경 사항"; fi
            echo
            if [ -n "$prev" ]; then range="${prev}..${GITHUB_REF_NAME}"; else range="${GITHUB_REF_NAME}"; fi
            git log --no-merges --pretty='- %s' "$range" | grep -vE '^- (chore|ci|docs|test)(\(|:)' || true
            echo
            if [ -n "$prev" ]; then echo "전체 비교: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"; fi
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: blogwriter-*.apk
          body_path: notes.md
